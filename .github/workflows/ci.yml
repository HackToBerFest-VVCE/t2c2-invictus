name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python Packages & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install flake8 black mypy pytest-cov

      - name: Code formatting check (Black)
        run: black --check packages/ services/api/ tests/ examples/

      - name: Linting check (Flake8)
        run: flake8 packages/ services/api/ tests/ examples/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run Pytest Suite
        run: python -m pytest -v

      - name: Test Invariant CLI Runner on Reference Example
        run: python -m packages.verifier.cli --workspace examples/inventory-api --spec INVARIANT.md

  test-frontend:
    name: Web Dashboard Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_web
        run: |
          if [ -d "apps/web" ] && [ -f "apps/web/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        if: steps.check_web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Install frontend dependencies
        if: steps.check_web.outputs.exists == 'true'
        working-directory: apps/web
        run: npm install

      - name: Typecheck frontend (TypeScript)
        if: steps.check_web.outputs.exists == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit
